name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run tests with coverage
        run: npx vitest run --coverage --coverage.reporter=lcov --coverage.reporter=text
        env:
          CI: true

      # SonarCloud Scan:
      # If Automatic Analysis is enabled in SonarCloud dashboard (Administration -> Analysis Method),
      # the scanner aborts with exit code 3 ("You are running CI analysis while Automatic Analysis is enabled").
      # To avoid turning main and PR checks red while maintaining test coverage reporting:
      # 1. `continue-on-error: true` prevents an Automatic Analysis conflict from failing the workflow.
      # 2. An explicit follow-up step logs an actionable warning so admins can toggle Automatic Analysis off.
      - name: SonarCloud Scan
        id: sonarcloud
        uses: SonarSource/sonarcloud-github-action@v5.0.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Verify SonarCloud Scan Result
        if: steps.sonarcloud.outcome != 'success'
        run: |
          echo "::warning title=SonarCloud Analysis Notice::SonarCloud scan finished with a non-zero exit code (exit code 3 indicates Automatic Analysis is currently active in SonarCloud dashboard). To ensure test coverage reports are synced to SonarCloud, an admin should turn off Automatic Analysis under SonarCloud -> Project -> Administration -> Analysis Method."
